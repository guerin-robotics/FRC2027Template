# CI: build + format check on every PR and push to main.
#
# WPILib 2027 targets JDK 25 and Gradle 9, and this is a pure-Java robot project: the Systemcore
# and desktop JNI natives are precompiled maven artifacts, so no cross-compile toolchain is needed
# for `build`/`test`. We therefore run on a standard runner with Temurin 25.
#
# `java-version` below must agree with `sourceCompatibility` in build.gradle — otherwise CI goes
# green while a real deploy fails.
#
# UNVERIFIED (2027 alpha): this workflow has not run against GradleRIO 2027. Locally the build
# resolves the plugin and the wpilib maven artifacts from a WPILib 2027 install (the
# `wpilib/2027_alpha7` folder, see settings.gradle) that a CI runner does not have. If the first
# run fails on plugin or artifact resolution, fix the resolution (a maven repository for the alpha
# artifacts) — do not weaken this workflow.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build and run tests
        run: ./gradlew build
